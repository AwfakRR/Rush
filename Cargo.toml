[package]
name = "rush"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
notify-debouncer-mini = "0.5"
flate2 = "1"

oxc = { version = "0.151.0", features = ["transformer", "codegen", "semantic", "isolated_declarations", "ast_visit"] }

# ponytail: already transitive deps of axum, 0 new compilation cost
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 10: HTTP client for proxy forwarding. hyper/tokio already transitive via axum.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rcgen = "0.14.10"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }

# Integration tests only: both already in the tree via axum's ws feature.
[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
