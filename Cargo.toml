[package]
name = "rush"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
notify-debouncer-mini = "0.5"

# ponytail: unified umbrella crate with transformer, semantic, and codegen features
oxc = { version = "0.151.0", features = ["transformer", "codegen", "semantic"] }
