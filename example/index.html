<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rush Demo</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="demo">
    <h1>⚡ Rush</h1>
    <p>A minimal, fast dev server written in Rust.</p>
    <p class="mb-6 inline-block rounded-full bg-sky-950 px-3 py-1 text-xs font-semibold uppercase tracking-wider text-sky-200">
      CSS Modules + Tailwind
    </p>
    <div>
      <button id="counter">Clicks: 0</button>

    <p id="lazy-status" class="mt-4 text-sm text-sky-200" aria-live="polite">Lazy chunk not loaded yet.</p>
    <p id="plugin-demo" class="mt-4 text-sm text-sky-200"></p>
    <a class="mt-4 inline-block text-sky-300 underline" href="./about.html">About this build →</a>

  <script type="module" src="/main.js"></script>

</html>
